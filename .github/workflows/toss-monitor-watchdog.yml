name: TOSS Monitor Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: toss-monitor-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Check production monitor
        env:
          GH_TOKEN: ${{ github.token }}
          TOSS_API_TOKEN: ${{ secrets.TOSS_API_TOKEN }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          workflow="toss-monitor-production.yml"
          recovery_threshold_seconds=720
          now_epoch="$(date -u +%s)"
          today_jst="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          jst_hour="$(TZ=Asia/Tokyo date +%H)"

          if (( 10#${jst_hour} >= 3 && 10#${jst_hour} < 4 )); then
            echo "TOSS定期メンテナンス（03:00～04:00 JST）のため復旧判定を行いません。"
            exit 0
          fi

          runs="$(gh api --silent "repos/${repo}/actions/workflows/${workflow}/runs?per_page=20")"

          active_count="$(jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length' <<<"${runs}")"
          if (( active_count > 0 )); then
            echo "TOSS Monitorは稼働中または起動待ちです。復旧起動は行いません。"
            exit 0
          fi

          runtime_http="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            -H "Accept: application/json" \
            -H "X-TOSS-API-Token: ${TOSS_API_TOKEN}" \
            "https://toss-monitor-api.nbakaikai.workers.dev/api/runtime")"

          maintenance_until="$(jq -r '.maintenance_until // empty' <<<"${runtime_http}")"
          if [[ -n "${maintenance_until}" ]]; then
            maintenance_until_epoch="$(date -d "${maintenance_until}" +%s 2>/dev/null || echo 0)"
            if (( maintenance_until_epoch > now_epoch )); then
              echo "お知らせ由来のメンテナンス終了時刻まで復旧起動を行いません。終了: ${maintenance_until}"
              exit 0
            fi
          fi

          maintenance_dates_today="$(jq -r --arg today "${today_jst}" '
            any((.maintenance_dates // [])[]?; . == $today)
          ' <<<"${runtime_http}")"
          if [[ "${maintenance_dates_today}" == "true" ]]; then
            echo "お知らせで本日（${today_jst}）が終日メンテナンス対象のため復旧起動を行いません。"
            exit 0
          fi

          system_maintenance_now=false
          while IFS=$'\t' read -r start_iso end_iso; do
            [[ -z "${start_iso}" || -z "${end_iso}" ]] && continue
            start_epoch="$(date -d "${start_iso}" +%s 2>/dev/null || echo 0)"
            end_epoch="$(date -d "${end_iso}" +%s 2>/dev/null || echo 0)"
            if (( start_epoch > 0 && end_epoch > 0 && start_epoch <= now_epoch && end_epoch > now_epoch )); then
              system_maintenance_now=true
              echo "お知らせ由来のシステムメンテナンス時間帯です。復旧起動を行いません。"
              break
            fi
          done < <(jq -r '
            (.system_maintenance_windows // [])[]?
            | [(.start // ""), (.end // "")]
            | @tsv
          ' <<<"${runtime_http}")

          if [[ "${system_maintenance_now}" == "true" ]]; then
            exit 0
          fi

          last_completed_at="$(jq -r '
            [.workflow_runs[]
              | select(.status == "completed")
              | select(.conclusion != null)]
            | max_by(.completed_at // .updated_at)
            | (.completed_at // .updated_at // empty)
          ' <<<"${runs}")"

          if [[ -z "${last_completed_at}" ]]; then
            echo "完了済みのTOSS Monitor runが見つかりません。初回復旧起動を行います。"
          else
            last_completed_epoch="$(date -d "${last_completed_at}" +%s)"
            age="$((now_epoch - last_completed_epoch))"

            echo "最後の完了run: ${last_completed_at}"
            echo "経過秒数: ${age}"

            if (( age < recovery_threshold_seconds )); then
              echo "停止判定の閾値未満です。復旧起動は行いません。"
              exit 0
            fi

            echo "12分以上新しいrunがないため、TOSS Monitorを復旧起動します。"
          fi

          gh api --silent -X POST \
            "repos/${repo}/actions/workflows/${workflow}/dispatches" \
            -f ref=main

          echo "TOSS Monitorの復旧起動を要求しました。"
