name: TOSS Monitor Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["TOSS Monitor Production"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: toss-monitor-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Check production monitor health
        env:
          GH_TOKEN: ${{ github.token }}
          TOSS_API_TOKEN: ${{ secrets.TOSS_API_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PRODUCTION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          workflow=".github/workflows/toss-monitor-production.yml"
          recovery_threshold_seconds=720

          now_epoch="$(date -u +%s)"
          today_jst="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          jst_hour="$(TZ=Asia/Tokyo date +%H)"

          # 結婚式前日・当日はTOSSシステムを完全休止。
          # Watchdog自身もAPI/KV確認や復旧起動を行わない。
          if [[ "$today_jst" == "2026-10-16" || "$today_jst" == "2026-10-17" ]]; then
            echo "TOSSは $today_jst は終日休止中のためWatchdogを停止します。"
            exit 0
          fi

          # システム側の夜間停止 01:00～07:00 JST
          if (( 10#${jst_hour} >= 1 && 10#${jst_hour} < 7 )); then
            echo "01:00～07:00 JSTの夜間停止時間のため復旧判定を行いません。"
            exit 0
          fi

          # 本番の手動・定時実行を監視する。
          # 過去のBootstrap用push Runは復旧判定へ影響させない。
          runs="$(gh api "repos/${repo}/actions/runs?per_page=100")"

          active_count="$(jq --arg workflow "${workflow}" '
            [
              .workflow_runs[]
              | select(.path == $workflow)
              | select(.event == "workflow_dispatch" or .event == "schedule")
              | select(.status == "queued" or .status == "in_progress")
            ] | length
          ' <<<"${runs}")"

          if (( active_count > 0 )); then
            echo "TOSS Monitorは稼働中または起動待ちです。復旧起動は行いません。"
            exit 0
          fi

          # Cloudflare Runtimeを実際のTOSS取得成否の基準として使用する。
          runtime_http="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            -H "Accept: application/json" \
            -H "X-TOSS-API-Token: ${TOSS_API_TOKEN}" \
            "https://toss-monitor-api.nbakaikai.workers.dev/api/runtime")"

          # お知らせ由来のメンテナンスを最優先で除外。
          maintenance_until="$(jq -r '.maintenance_until // empty' <<<"${runtime_http}")"
          if [[ -n "${maintenance_until}" ]]; then
            maintenance_until_epoch="$(date -d "${maintenance_until}" +%s 2>/dev/null || echo 0)"
            if (( maintenance_until_epoch > now_epoch )); then
              echo "お知らせ由来のメンテナンス中です。復旧起動を行いません。終了: ${maintenance_until}"
              exit 0
            fi
          fi

          maintenance_dates_today="$(jq -r --arg today "${today_jst}" '
            any((.maintenance_dates // [])[]?; . == $today)
          ' <<<"${runtime_http}")"
          if [[ "${maintenance_dates_today}" == "true" ]]; then
            echo "お知らせで本日（${today_jst}）が終日メンテナンス対象のため復旧起動を行いません。"
            exit 0
          fi

          system_maintenance_now=false
          while IFS=$'\\t' read -r start_iso end_iso; do
            [[ -z "${start_iso}" || -z "${end_iso}" ]] && continue
            start_epoch="$(date -d "${start_iso}" +%s 2>/dev/null || echo 0)"
            end_epoch="$(date -d "${end_iso}" +%s 2>/dev/null || echo 0)"
            if (( start_epoch > 0 && end_epoch > 0 && start_epoch <= now_epoch && end_epoch > now_epoch )); then
              system_maintenance_now=true
              echo "お知らせ由来のシステムメンテナンス時間帯です。復旧起動を行いません。"
              break
            fi
          done < <(jq -r '
            (.system_maintenance_windows // [])[]?
            | [(.start // ""), (.end // "")]
            | @tsv
          ' <<<"${runtime_http}")

          if [[ "${system_maintenance_now}" == "true" ]]; then
            exit 0
          fi

          # 本体Run失敗/キャンセル時は、メンテナンスでない限り即時復旧。
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            if [[ "${PRODUCTION_CONCLUSION}" == "success" ]]; then
              echo "直前のTOSS Monitorは成功終了しています。復旧起動は行いません。"
              exit 0
            fi

            echo "直前のTOSS Monitorが ${PRODUCTION_CONCLUSION:-unknown} で終了したため、復旧起動を試みます。"
          else
            # schedule / 手動起動では、実際のTOSS取得成功時刻を監視。
            last_success_at="$(jq -r '.last_success_at // empty' <<<"${runtime_http}")"

            if [[ -n "${last_success_at}" ]]; then
              last_success_epoch="$(date -d "${last_success_at}" +%s 2>/dev/null || echo 0)"
            else
              last_success_epoch=0
            fi

            if (( last_success_epoch > 0 )); then
              age="$((now_epoch - last_success_epoch))"
              echo "最後のTOSS取得成功: ${last_success_at}"
              echo "成功からの経過秒数: ${age}"

              if (( age < recovery_threshold_seconds )); then
                echo "停止判定の閾値未満です。復旧起動は行いません。"
                exit 0
              fi

              echo "12分以上TOSS取得成功がないため、復旧起動します。"
            else
              completed_count="$(jq --arg workflow "${workflow}" '
                [
                  .workflow_runs[]
                  | select(.path == $workflow)
                  | select(.event == "workflow_dispatch" or .event == "schedule")
                  | select(.status == "completed")
                ] | length
              ' <<<"${runs}")"

              if (( completed_count == 0 )); then
                echo "TOSS Monitorの完了履歴がなく、成功時刻もありません。初回復旧起動を行います。"
              else
                latest_created_at="$(jq -r --arg workflow "${workflow}" '
                  [
                    .workflow_runs[]
                    | select(.path == $workflow)
                    | select(.event == "workflow_dispatch" or .event == "schedule")
                    | select(.status == "completed")
                  ]
                  | max_by(.completed_at // .updated_at // .created_at)
                  | (.completed_at // .updated_at // .created_at // empty)
                ' <<<"${runs}")"

                latest_epoch="$(date -d "${latest_created_at}" +%s 2>/dev/null || echo 0)"
                age="$((now_epoch - latest_epoch))"

                echo "最後の完了TOSS Monitor: ${latest_created_at}"
                echo "経過秒数: ${age}"

                if (( age < recovery_threshold_seconds )); then
                  echo "停止判定の閾値未満です。復旧起動は行いません。"
                  exit 0
                fi

                echo "12分以上新しい完了Runがないため、復旧起動します。"
              fi
            fi
          fi

          gh api --silent -X POST \
            "repos/${repo}/actions/workflows/toss-monitor-production.yml/dispatches" \
            -f ref=main

          echo "TOSS Monitorの復旧起動を要求しました。"
