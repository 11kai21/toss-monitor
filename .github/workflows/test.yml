name: TOSS Monitor Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: GitHub Actionsテスト
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Runner確認
        run: |
          echo "GitHub Actions は正常に起動しました"
          python --version
          uname -a
