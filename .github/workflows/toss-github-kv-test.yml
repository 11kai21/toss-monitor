name: TOSS GitHub to KV Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toss-kv-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run TOSS once and save state to KV
        env:
          TOSS_API_TOKEN: ${{ secrets.TOSS_API_TOKEN }}
          TOSS_FORCE_SCAN: "1"
        run: python toss_monitor_github.py

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: toss-github-kv-test-output
          path: |
            toss_status.txt
            toss_trace.txt
            toss_runtime.json
          if-no-files-found: ignore
