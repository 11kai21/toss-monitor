name: TOSS Monitor Production

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: toss-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Ensure scheduled workflow is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/toss-monitor-production.yml/enable"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/toss-monitor-production.yml" --jq '"workflow_state=" + .state'
          echo "Workflow enable/resync request: OK"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run TOSS monitor once
        env:
          TOSS_API_TOKEN: ${{ secrets.TOSS_API_TOKEN }}
        run: python toss_monitor_github.py

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: toss-monitor-diagnostics-${{ github.run_id }}
          path: |
            toss_status.txt
            toss_trace.txt
            toss_runtime.json
          if-no-files-found: ignore
