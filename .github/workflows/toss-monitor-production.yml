name: TOSS Monitor Production

on:
  workflow_dispatch:
  # Bootstrap only: this condition below prevents later ordinary pushes from starting a chain.
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: toss-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'push' || github.event.head_commit.message == 'Bootstrap scheduler'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Mark cycle start
        run: echo "CYCLE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run TOSS monitor once
        env:
          TOSS_API_TOKEN: ${{ secrets.TOSS_API_TOKEN }}
        run: python toss_monitor_github.py

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: toss-monitor-diagnostics-${{ github.run_id }}
          path: |
            toss_status.txt
            toss_trace.txt
            toss_runtime.json
          if-no-files-found: ignore

      - name: Start next 5-minute cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start="${CYCLE_START:-$(date +%s)}"
          now="$(date +%s)"
          elapsed=$((now - start))
          remaining=$((300 - elapsed))
          if (( remaining > 0 )); then
            echo "次回runまで ${remaining} 秒待機"
            sleep "$remaining"
          else
            echo "取得処理が5分を超えたため待機なし"
          fi
          gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/toss-monitor-production.yml/dispatches" -f ref=main
          echo "次回TOSS Monitor runを起動しました"
