name: TOSS Monitor

on:
  workflow_dispatch:
  schedule:
    # JST 11:02, 11:07, 11:12... のように毎時00分を避けて5分間隔
    - cron: "2-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: toss-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run TOSS monitor once
        env:
          TOSS_API_TOKEN: ${{ secrets.TOSS_API_TOKEN }}
        run: python toss_monitor_github.py

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: toss-monitor-diagnostics-${{ github.run_id }}
          path: |
            toss_status.txt
            toss_trace.txt
            toss_runtime.json
          if-no-files-found: ignore
